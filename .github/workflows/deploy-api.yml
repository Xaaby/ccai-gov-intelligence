name: Build and Deploy — ccai-gov-intelligence-api

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: earnest-sight-503519-t5
  REGION: us-central1
  SERVICE: ccai-gov-intelligence-api
  IMAGE: us-central1-docker.pkg.dev/earnest-sight-503519-t5/ccai-gov-intelligence/ccai-gov-intelligence-api

jobs:
  deploy:
    name: Build → Push → Deploy (API)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/786562162192/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gcp-devops-agent-sa@earnest-sight-503519-t5.iam.gserviceaccount.com

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile.api \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 10 \
            --set-secrets GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Show deployed service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)"
